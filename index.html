/* Layout: an app with a start screen of modules; one narrow notebook column; maps drawn as inline SVG; tab bar at the thumb. */
:root{
  --bg:#F4ECE0; --surface:#FBF7F0; --surface-2:#EEE2D1; --ink:#2A1218; --muted:#6E5651; --line:#DFCDB6;
  --claret:#8E2A3A; --on-claret:#FBF3EA; --gold:#94702F; --gold-bar:#C9A15B; --good:#3F6B3A; --warn:#9A5B12; --bad:#8E2A3A;
  --land:#E6D6BF; --land-wine:#D9B9A0; --land-line:#F8F1E6; --sea:#EFE5D6; --deep:#2A1218; --on-deep:#F3E9DC; --on-deep-muted:#D9C7B4;
  --shadow:0 10px 30px rgba(42,18,24,.12);
  --seal-fund:#B08A3E; --seal-kern:#8E2A3A; --seal-fans:#5A2F63; --seal-verd:#35603A; --seal-ms:#2A1218; --seal-ink:#FBF3EA; --seal-ring:#E9CF86; --locked:#CDBBA6;
  --f-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --f-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#160A0D; --surface:#241318; --surface-2:#30181F; --ink:#F3E9DC; --muted:#BDA697; --line:#43262D;
  --claret:#D47A88; --on-claret:#1A0A0E; --gold:#D6B06A; --gold-bar:#C9A15B; --good:#93BF88; --warn:#E0A55A; --bad:#E08A96;
  --land:#3A2228; --land-wine:#5A2E38; --land-line:#1E0E12; --sea:#1C0D11; --deep:#4A1C26; --on-deep:#F3E9DC; --on-deep-muted:#D9C7B4;
  --seal-ms:#6B3A45; --locked:#4A3036;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#160A0D; --surface:#241318; --surface-2:#30181F; --ink:#F3E9DC; --muted:#BDA697; --line:#43262D;
  --claret:#D47A88; --on-claret:#1A0A0E; --gold:#D6B06A; --gold-bar:#C9A15B; --good:#93BF88; --warn:#E0A55A; --bad:#E08A96;
  --land:#3A2228; --land-wine:#5A2E38; --land-line:#1E0E12; --sea:#1C0D11; --deep:#4A1C26; --on-deep:#F3E9DC; --on-deep-muted:#D9C7B4;
  --seal-ms:#6B3A45; --locked:#4A3036;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);background-image:radial-gradient(ellipse at 100% 0%, var(--surface) 0%, var(--bg) 55%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--claret);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--claret);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1;text-decoration:none}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;color:var(--ink)}
.brand span{font-size:12px;color:var(--muted)}
.me{width:32px;height:32px;border-radius:50%;border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--claret);border-color:var(--claret);color:var(--on-claret)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{max-width:760px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px}
.banner{border:1px solid var(--warn);color:var(--ink);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.crumbs a{color:var(--claret);text-decoration:none;font-weight:600}
.head{display:flex;flex-direction:column;gap:6px}
.head h1{font-size:clamp(32px, 8vw, 44px)}

/* start */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.hero h1{font-size:clamp(38px, 10vw, 56px)}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);min-width:0;text-align:left}
.mod:hover{border-color:var(--claret)}
.mod h2{font-size:24px}
.mod p{font-size:13px;color:var(--muted)}
.mod .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--claret)}
.mod.feature{grid-column:1 / -1;background:var(--deep);border-color:var(--deep);color:var(--on-deep);padding:18px}
.mod.feature p{color:var(--on-deep-muted)}
.mod.feature .eyebrow{color:var(--gold-bar)}
.mod.feature h2{font-size:30px}
.mod.map{grid-column:1 / -1}
.mod.map svg{width:100%;height:auto;display:block}
.progress{height:6px;border-radius:3px;background:color-mix(in srgb, var(--on-deep) 18%, transparent);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold-bar)}

/* avond */
.avond-nav{display:flex;gap:8px;align-items:center}
.avond-nav select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.icon-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.state-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.blind{border-color:var(--claret);color:var(--claret)}
.pill.open{border-color:var(--good);color:var(--good)}
.glasses{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.glasses{grid-template-columns:1fr 1fr}}
.glass{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.glass:hover{border-color:var(--claret)}
.letter{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:.9;color:var(--claret)}
.g-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.g-name{font-weight:600;font-size:15px}
.g-sub{font-size:13px;color:var(--muted)}
.g-foot{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin-top:4px}
.stars{color:var(--gold);letter-spacing:1px}
.todo{color:var(--claret);font-weight:600}

/* lists */
.filters{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px}
@media (min-width:620px){.filters{grid-template-columns:repeat(4, minmax(0,1fr))}}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row .r-title{font-weight:600;min-width:0}
.row .r-sub{font-size:13px;color:var(--muted);grid-column:1}
.row .r-side{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
div.row{cursor:default}
.empty{border:1px dashed var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px}

/* kaart */
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);align-self:flex-start}
.seg-toggle button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg-toggle button[aria-pressed="true"]{background:var(--claret);color:var(--on-claret)}
.mapbox{border:1px solid var(--line);background:var(--sea);border-radius:16px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:72vh}
.m-bg{fill:var(--land);stroke:var(--land-line);stroke-width:.6}
.m-wine{fill:var(--land-wine);stroke:var(--land-line);stroke-width:.8;cursor:pointer}
.m-wine.oud{fill:color-mix(in srgb, var(--claret) 55%, var(--land))}
.m-wine.nieuw{fill:color-mix(in srgb, var(--gold-bar) 70%, var(--land))}
.m-wine.dim{fill:var(--land-wine);opacity:.55;cursor:default}
.m-wine:hover{filter:brightness(1.08)}
.m-lab{font-family:var(--f-body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.m-country{fill:var(--land);stroke:var(--muted);stroke-width:1.2}
.dot{cursor:pointer}
.dot .c-done{fill:var(--claret);stroke:var(--surface);stroke-width:2}
.dot .c-plan{fill:var(--surface);stroke:var(--gold);stroke-width:3}
.dot .c-none{fill:var(--muted);opacity:.5}
.dot .c-own{fill:var(--good);stroke:var(--surface);stroke-width:2}
.dot text{font-family:var(--f-body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dot .t-done{fill:var(--on-claret)}.dot .t-plan{fill:var(--ink)}
.dot .ring{fill:none;stroke:none}
.dot.sel .ring{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.r-lab{font-family:var(--f-body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.lg-done{background:var(--claret)}.lg-plan{border:2px solid var(--gold);background:var(--surface)}.lg-own{background:var(--good)}
.worlds{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.worlds{grid-template-columns:1fr 1fr}}
.world-card{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:16px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.world-card h2{font-size:30px}
.world-card.oud{border-top:4px solid var(--claret)}.world-card.nieuw{border-top:4px solid var(--gold-bar)}
.world-card p{font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--claret)}
.tile h3{font-size:22px}
.tile p{font-size:13px;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.counts b{font-variant-numeric:tabular-nums}
.c1{color:var(--claret)}.c2{color:var(--gold)}.c3{color:var(--good)}
.region-panel{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.region-panel h2{font-size:28px}
.reg-list{display:flex;flex-wrap:wrap;gap:6px}
.reg-list button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.reg-list button[aria-pressed="true"]{border-color:var(--claret);color:var(--claret);font-weight:600}
.reg-list button.zero{color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid currentColor}

/* profiel */
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px}
.stats b{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--claret);margin-right:4px}

.card-sec{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}

/* spijs */
.pair{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-block:12px}

.ok-ja{color:var(--good);font-weight:600}.ok-deels{color:var(--warn);font-weight:600}.ok-nee{color:var(--bad);font-weight:600}

/* emblemen + groep */
.seal{display:block;flex:none}
.seal .s-bg{stroke:var(--seal-ring);stroke-width:3}
.seal .s-ring{fill:none;stroke:var(--seal-ring);stroke-width:1.5;stroke-dasharray:3 3}

.seal.locked .s-bg{fill:var(--locked);stroke:var(--line)}

.seal-row{display:flex;flex-wrap:wrap;gap:4px}
.done-line{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px}
.people{display:flex;flex-direction:column;gap:10px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.person-top img{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.person-top b{font-size:16px}
.person-top .num{margin-left:auto;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}

.bar.full i{background:var(--gold-bar)}

.ok{color:var(--good);font-weight:700}.nok{color:var(--bad);font-weight:700}

.qopts{display:flex;flex-direction:column;gap:8px}

/* versie 3 */

.chart svg{display:block;width:100%;min-width:320px;height:auto}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:env(safe-area-inset-bottom, 0px)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,8,12,.5);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:700px){.sheet{align-items:center}}

.step{display:flex;flex-direction:column;gap:12px}
.step h3{font-size:22px;display:flex;align-items:baseline;gap:8px}
.step h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0;min-width:0}
.field legend,.field>span{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--claret);border-color:var(--claret);color:var(--on-claret)}
.aroma-group{display:flex;flex-direction:column;gap:6px}

.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}

.group-box{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const APP_VERSIE='3.0';

};

function allWines(){
  const out={};
  for(const [id,w] of Object.entries(S.wines)) out[id]={...w,id,eigen:false};
  for(const [uid,doc] of Object.entries(S.extra)) for(const [id,w] of Object.entries((doc&&doc.w)||{})) out[id]={...w,id,eigen:true,toegevoegdDoor:uid};
  return out;
}
const isOpen=n=>!!(S.settings['avond-'+n]&&S.settings['avond-'+n].onthuld);
const revealed=w=>!!w&&(w.eigen||isOpen(w.avond));
const myT=()=>(S.tastings[S.uid]&&S.tastings[S.uid].t)||{};
function allT(){const out=[];for(const [uid,doc] of Object.entries(S.tastings)) for(const [wid,t] of Object.entries((doc&&doc.t)||{})) out.push({uid,wid,t});return out}
function stijlVan(w,t){return (w&&w.stijl)||KLEUR_STIJL[t&&t.uiterlijk&&t.uiterlijk.kleur]||''}
const worldOf=land=>GEO.countries[land]?GEO.countries[land].world:null;

/* match a wine's region text to a region on the country map */
function regionOf(w){
  const c=GEO.countries[w.land];if(!c)return null;
  const raw=String(w.regio||'').toLowerCase().trim();if(!raw||raw==='—'||raw==='-')return null;
  for(const r of c.regions) if(r.n.toLowerCase()===raw) return r.n;
  const inner=(raw.match(/\(([^)]+)\)/)||[])[1];
  for(const part of [inner,raw]){
    if(!part)continue;let best=null,len=0;
    for(const r of c.regions) for(const a of r.al) if(part.includes(a)&&a.length>len){best=r.n;len=a.length}
    if(best)return best;
  }
  return null;
}

let raf=0;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(doRender)}
function doRender(){

  v.innerHTML=fn();

  if(S.view==='druiven'&&S.grape){const el=document.getElementById('g-'+slugify(S.grape));if(el)el.scrollIntoView({block:'start'})}
  fillNames(v);
}
async function fillNames(root){
  const els=[...root.querySelectorAll('[data-uid]')];if(!els.length)return;
  const ids=[...new Set(els.map(e=>e.dataset.uid))];
  let ps={};if(S.user){try{ps=await S.user.profiles(ids)}catch(e){}}
  els.forEach(e=>{const id=e.dataset.uid;const p=ps[id];const nick=S.tastings[id]&&S.tastings[id].bijnaam;
    e.textContent=(id===S.uid&&!e.dataset.full)?'jij':((p&&p.name)||nick||'iemand');
    if(e.dataset.avatar!==undefined){const img=e.parentElement.querySelector('img');if(img&&p)img.src=p.avatarUrl}});
}

function profileTop(){
  const W=allWines();const m={};
  Object.entries(myT()).forEach(([wid,t])=>{const w=W[wid];if(!w||!t.score||!revealed(w))return;druiven(w).forEach(d=>(m[d]=m[d]||[]).push(t.score))});
  const k=Object.keys(m).sort((a,b)=>avg(m[b])-avg(m[a]))[0];return k||'';
}

  const head=`<div class="crumbs"><a href="#start">Start</a><span>›</span><span>Mijn wijnen</span></div>`;
  if(!rows.length) return head+`<div class="head"><h1>Jouw proefnotities</h1></div>`+emptyBox('Nog niets geproefd','Vul op een avond de proefkaart in, of noteer een fles van thuis met <b>+ Eigen wijn</b>. Je notities verschijnen hier.');

  const landen=[...new Set(open.map(r=>r.w.land).filter(Boolean))].sort();

  const sel=(id,label,val,options)=>`<label for="${id}">${label}<select id="${id}" data-filter="${id.slice(2)}"><option value="">Alle</option>${options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;

/* ---------- wijnkaart ---------- */
/* stats per land for the current mode: tasted (gedronken), planned (gepland), own (eigen) */
function landStats(){
  const W=allWines();const mine=myT();const tasted=new Set(allT().map(x=>x.wid));
  const st={};
  for(const w of Object.values(W)){
    if(!w.land)continue;
    if(w.eigen&&S.kaartMode==='ik'&&w.toegevoegdDoor!==S.uid)continue;
    const s=st[w.land]=st[w.land]||{done:0,plan:0,own:0,items:[]};
    const isDone=S.kaartMode==='ik'?!!mine[w.id]:tasted.has(w.id);
    if(w.eigen)s.own++;else if(isDone)s.done++;else s.plan++;
    s.items.push({w,done:isDone});
  }
  return st;
}
function countsHtml(s){return `<span class="counts"><span class="c1"><b>${s.done}</b> gedronken</span><span class="c2"><b>${s.plan}</b> gepland</span>${s.own?`<span class="c3"><b>${s.own}</b> eigen</span>`:''}</span>`}
function worldSvg(kind){
  const st=landStats();
  const m=kind==='oud'?GEO.europe:GEO.world;
  const vb=m.vb.join(' ');
  const paths=Object.entries(m.wine).map(([nl,d])=>{
    const wld=worldOf(nl);const active=kind==='mini'||kind==='world'||kind===wld;
    const s=st[nl];const label=`${nl}${s?`: ${s.done} gedronken, ${s.plan} gepland`:''}`;
    return active&&kind!=='mini'?`<a href="#land-${GEO.countries[nl].slug}" aria-label="${esc(label)}"><path class="m-wine ${wld}" d="${d}"><title>${esc(label)}</title></path></a>`
      :`<path class="m-wine ${active?wld:'dim'}" d="${d}"></path>`}).join('');
  let labels='';
  if(kind==='oud'||kind==='nieuw'){
    const fs=kind==='oud'?24:17;
    labels=Object.entries(m.lab).filter(([nl])=>worldOf(nl)===kind).map(([nl,[x,y]])=>`<text class="m-lab" x="${x}" y="${y}" font-size="${fs}" text-anchor="middle">${esc(nl)}</text>`).join('');
  }
  return `<svg viewBox="${vb}" role="img" aria-label="Wereldkaart met de wijnlanden" preserveAspectRatio="xMidYMid meet"><path class="m-bg" d="${m.bg}"></path>${paths}${labels}</svg>`;
}
function modeToggle(){return '';return `<div class="seg-toggle" role="group" aria-label="Wiens wijnen"><button type="button" data-act="mode" data-mode="ik" aria-pressed="${S.kaartMode==='ik'}">Ik</button><button type="button" data-act="mode" data-mode="groep" aria-pressed="${S.kaartMode==='groep'}">Groep</button></div>`}

  const st=landStats();
  const sum=w=>Object.entries(st).filter(([l])=>worldOf(l)===w).reduce((a,[,s])=>({done:a.done+s.done,plan:a.plan+s.plan,own:a.own+s.own,n:a.n+1}),{done:0,plan:0,own:0,n:0});
  const o=sum('oud'),n=sum('nieuw');

    <div class="head"><p class="eyebrow">Wijnkaart</p><h1>Waar ${S.kaartMode==='ik'?'jij':'we'} al geweest ${S.kaartMode==='ik'?'bent':'zijn'}</h1></div>

      <a class="world-card oud" href="#oud"><p class="eyebrow">Europa</p><h2>Oude Wereld</h2><p>${plural(o.n,'land','landen')} met wijn in het journaal</p>${countsHtml(o)}</a>
      <a class="world-card nieuw" href="#nieuw"><p class="eyebrow">Amerika, Afrika en Oceanië</p><h2>Nieuwe Wereld</h2><p>${plural(n.n,'land','landen')} met wijn in het journaal</p>${countsHtml(n)}</a>
    </div>
    ${other.length?`<div class="card-sec"><h2>Overige landen</h2><p class="muted">Eigen wijnen uit landen die nog niet op de kaart staan.</p><div class="rows">${other.flatMap(([,s])=>s.items).map(({w})=>ownRow(w)).join('')}</div></div>`:''}`;
}
function viewWorld(kind){
  const st=landStats();
  const lands=Object.keys(GEO.countries).filter(l=>worldOf(l)===kind).sort((a,b)=>{const x=st[a]||{done:0,plan:0,own:0},y=st[b]||{done:0,plan:0,own:0};return (y.done+y.own)-(x.done+x.own)||(y.plan-x.plan)||a.localeCompare(b)});
  const title=kind==='oud'?'Oude Wereld':'Nieuwe Wereld';
  return `<div class="crumbs"><a href="#start">Start</a><span>›</span><a href="#kaart">Wijnkaart</a><span>›</span><span>${title}</span></div>
    <div class="head"><p class="eyebrow">${kind==='oud'?'Europa':'Amerika, Afrika en Oceanië'}</p><h1>${title}</h1></div>
    ${modeToggle()}
    <div class="mapbox">${worldSvg(kind)}</div>
    <div class="tiles">${lands.map(l=>{const s=st[l]||{done:0,plan:0,own:0};const c=GEO.countries[l];
      return `<a class="tile" href="#land-${c.slug}"><h3>${esc(l)}</h3><p>${plural(c.regions.length,'wijnregio','wijnregio’s')} op de kaart</p>${countsHtml(s)}</a>`}).join('')}</div>`;
}
function regionStats(land){
  const s=landStats()[land]||{done:0,plan:0,own:0,items:[]};
  const reg={};const none=[];
  for(const it of s.items){const r=regionOf(it.w);if(!r){none.push(it);continue}(reg[r]=reg[r]||[]).push(it)}
  return {reg,none,s};
}
function viewLand(){
  const land=S.land;const c=GEO.countries[land];
  if(!c)return emptyBox('Land niet gevonden','Ga terug naar de <a href="#kaart">wijnkaart</a>.');
  const {reg,none,s}=regionStats(land);
  const tot=r=>(reg[r]||[]).length;
  const k=Math.max(.55,Math.min(1,Math.min(c.vb[2],c.vb[3])/500));const q=v=>Math.round(v*k*10)/10;
  if(!S.region||(!c.regions.find(r=>r.n===S.region))){const best=c.regions.slice().sort((a,b)=>tot(b.n)-tot(a.n))[0];S.region=best?best.n:null}

      <circle class="ring" cx="${r.x}" cy="${r.y}" r="${rad+q(6)}"></circle>

function regionPanel(name,items){
  if(!name)return '';
  const done=items.filter(i=>i.done&&!i.w.eigen).length,plan=items.filter(i=>!i.done&&!i.w.eigen).length,own=items.filter(i=>i.w.eigen).length;
  return `<p class="eyebrow">Wijnregio</p><h2>${esc(name)}</h2>${regionCard(S.land,name)}${countsHtml({done,plan,own})}
    ${items.length?`<div class="rows">${itemsHtml(items)}</div>`:'<p class="muted">Nog geen wijnen uit deze regio. Een eigen fles uit deze regio voeg je toe met <b>+ Eigen wijn</b>.</p>'}`;
}
function itemsHtml(items){
  const mine=myT();
  const blindBy={};const rows=[];
  items.slice().sort((a,b)=>(+a.w.avond||99)-(+b.w.avond||99)).forEach(({w,done})=>{
    if(w.eigen){rows.push(ownRow(w));return}
    if(!revealed(w)){const k=w.avond;blindBy[k]=blindBy[k]||{n:0,done:0};blindBy[k].n++;if(done)blindBy[k].done++;return}
    rows.push(wineRow(w,mine[w.id],w.id));
  });
  const blind=Object.entries(blindBy).map(([a,b])=>`<div class="row"><span class="r-title">Avond ${esc(a)} · ${plural(b.n,'wijn','wijnen')} nog blind</span><span class="r-sub">${esc(AVONDEN[a]?AVONDEN[a][1]:'')}${b.done?` · ${b.done} al geproefd`:''}</span><span class="r-side"><span class="badge c2">gepland</span></span></div>`).join('');
  return rows.join('')+blind;
}
function ownRow(w){const t=myT()[w.id];return `<button type="button" class="row" data-act="taste" data-wid="${esc(w.id)}">
  <span class="r-title">${esc(w.naam)} <span class="badge c3">eigen</span></span>
  <span class="r-sub">${esc([w.regio,w.druif,w.stijl,euro(w.prijs)].filter(x=>x&&x!=='—').join(' · '))}</span>
  <span class="r-side">${t?stars(t.score):'<span class="todo">Proeven</span>'}</span></button>`}
/* region labels: largest first, try right, left, above, below; skip when it would overlap */
function placeLabels(){
  const svg=$('#landmap');if(!svg)return;const g=$('#labels');
  const vb=svg.viewBox.baseVal;const boxes=[];const k=+svg.dataset.k||1;
  const dots=[...svg.querySelectorAll('.dot')];
  dots.forEach(d=>{const x=+d.dataset.x,y=+d.dataset.y,r=+d.dataset.r;boxes.push([x-r,y-r,x+r,y+r])});
  const hit=b=>boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]);
  const inside=b=>b[0]>=vb.x&&b[2]<=vb.x+vb.width&&b[1]>=vb.y&&b[3]<=vb.y+vb.height;
  const list=dots.filter(d=>d.dataset.label).sort((a,b)=>(b.classList.contains('sel')-a.classList.contains('sel'))||(+b.dataset.r-+a.dataset.r));
  let html='';
  for(const d of list){
    const x=+d.dataset.x,y=+d.dataset.y,r=+d.dataset.r,t=d.dataset.label;const w=t.length*10.2*k,h=22*k,o=5*k;
    const cands=[[x+r+o,y-h/2],[x-r-o-w,y-h/2],[x-w/2,y-r-o-h],[x-w/2,y+r+o]];
    for(const [bx,by] of cands){const b=[bx,by,bx+w,by+h];if(inside(b)&&!hit(b)){boxes.push(b);html+=`<text class="r-lab" x="${bx}" y="${by+16*k}" font-size="${19*k}" stroke-width="${5*k}">${esc(t)}</text>`;break}}
  }
  g.innerHTML=html;
}

/* ---------- profiel ---------- */
function viewProfiel(){
  const W=allWines();
  const mine=Object.entries(myT()).map(([wid,t])=>({w:W[wid],t})).filter(x=>x.w&&x.t.score);
  const all=allT().map(x=>({w:W[x.wid],t:x.t})).filter(x=>x.w&&x.t.score);
  const groupBy=(rows,keyFn)=>{const m={};rows.forEach(r=>{(keyFn(r)||[]).forEach(k=>{if(!k)return;(m[k]=m[k]||[]).push(r.t.score)})});return m};
  const sec=(title,keyFn,limit)=>{
    const a=groupBy(mine,keyFn),g=groupBy(all,keyFn);
    const keys=Object.keys(a).sort((x,y)=>avg(a[y])-avg(a[x])||a[y].length-a[x].length).slice(0,limit);
    if(!keys.length)return '';
    return `<div class="card-sec"><h2>${title}</h2><div class="bars">${keys.map(k=>{const m=avg(a[k]),gr=avg(g[k]||[]);return `<div class="bar-row"><span class="lbl">${esc(k)}</span>
      <div class="track" aria-hidden="true"><i class="mine" style="width:${m/5*100}%"></i></div>
      <span class="vals num">${fmt(m)} gemiddeld · ${plural(a[k].length,'wijn','wijnen')}</span></div>`}).join('')}</div></div>`};
  const rvKey=f=>r=>revealed(r.w)?f(r):[];
  const landen=new Set(mine.filter(r=>revealed(r.w)).map(r=>r.w.land));
  const body=sec('Druiven',rvKey(r=>druiven(r.w)),12)+sec('Landen',rvKey(r=>[r.w.land]),10)+sec('Regio’s',rvKey(r=>[regionOf(r.w)]),10)+sec('Stijlen',r=>[stijlVan(r.w,r.t)],6)+sec('Zuur dat je proefde',r=>[r.t.mond&&r.t.mond.zuur?'zuur '+r.t.mond.zuur:''],3)+sec('Body',r=>[r.t.mond&&r.t.mond.body?'body '+r.t.mond.body:''],3);
  return `<div class="crumbs"><a href="#start">Start</a><span>›</span><span>Profiel</span></div>
   ${badgesSection()}
   ${valkuilenSectie()}${leerGrafiek()}
   <div class="head card-sec"><p class="eyebrow">Smaakprofiel</p><h1>Wat jij het hoogst scoort</h1></div>
   ${mine.length?`<div class="stats num"><span><b>${mine.length}</b>wijnen met score</span><span><b>${landen.size}</b>landen</span><span><b>${fmt(avg(mine.map(r=>r.t.score)))}</b>gemiddelde score</span></div>
${body}`
   :emptyBox('Nog geen profiel','Geef op de proefkaart een score van 1 tot 5. Na een paar wijnen zie je hier welke druiven, landen en stijlen je het meest liggen.')}
`;
}

function blankTasting(){return {uiterlijk:{helderheid:'',intensiteit:'',kleur:''},neus:{intensiteit:'',aromas:[]},mond:{zoet:'',zuur:'',tannine:'',alcohol:'',body:'',afdronk:''},gok:{druif:'',land:'',klimaat:'',hout:'',prijs:''},kwaliteit:'',score:0,notitie:'',spijs:'',spijsWerkte:'',favoriet:false}}
function openTaste(wid,wineFallback){
  const w=allWines()[wid]||wineFallback;if(!w)return;
  const ex=myT()[wid];const b=blankTasting();
  S.draft=ex?{...b,...JSON.parse(JSON.stringify(ex)),uiterlijk:{...b.uiterlijk,...(ex.uiterlijk||{})},neus:{...b.neus,...(ex.neus||{})},mond:{...b.mond,...(ex.mond||{})},gok:{...b.gok,...(ex.gok||{})}}:b;

function syncTextFields(){const n=$('#f-notitie'),s=$('#f-spijs'),gd=$('#f-gok-druif'),gl=$('#f-gok-land');if(n)S.draft.notitie=n.value;if(s)S.draft.spijs=s.value;if(gd)S.draft.gok.druif=gd.value.trim();if(gl)S.draft.gok.land=gl.value}
async function writeMine(coll,field,key,value){
  const bucket=coll==='tastings'?'t':'w';
  if(value===null)delete DATA[bucket][key];else DATA[bucket][key]={...value,bijgewerkt:new Date().toISOString()};
  if(!saveData())throw {code:'local'};
  syncState();
}
function dbErr(e){const c=e&&e.code;return c==='local'?'Opslaan lukte niet op dit toestel. Controleer of de browser opslag toestaat (geen privévenster).':c==='quota_exceeded'?'Het journaal is vol. Vraag Jeroen om oude gegevens op te ruimen.':c==='invalid_argument'?'Opslaan lukte niet: je hebt hier geen schrijfrechten.':c==='revoked'?'Je toegang is gewijzigd. Herlaad de pagina.':'Opslaan lukte niet. Probeer het zo nog eens.'}
async function saveTaste(goNext){
  syncTextFields();const w=S.draftWine;const nxt=goNext?nextGlass(w):null;
  const t={...S.draft,wijnId:w.id,userId:S.uid,avond:w.eigen?null:Number(w.avond),datum:(myT()[w.id]&&myT()[w.id].datum)||new Date().toISOString().slice(0,10)};
  const before=new Set(badgesFor(S.uid).map(b=>b.id));
  try{await writeMine('tastings','t',w.id,t);
    const after=badgesFor(S.uid,{...myT(),[w.id]:t});const fresh=after.filter(b=>!before.has(b.id));
    if(nxt){openTaste(nxt.id);$('#panel .panel-body').scrollTop=0;if(fresh.length)celebrate(fresh);else toast('Glas '+w.glas+' bewaard');return}
    closeSheet();
    if(fresh.some(b=>b.type==='avond'))backupNudge();
    if(fresh.length)celebrate(fresh);else toast(revealed(w)?'Proefkaart bewaard':'Bewaard. De wijn blijft blind tot de onthulling.')}

function planByAvond(){const W=allWines();const plan={};Object.values(W).forEach(w=>{if(!w.eigen)(plan[w.avond]=plan[w.avond]||[]).push(w.id)});return plan}
function avondBadge(a){return {id:'avond-'+a,type:'avond',avond:a,kort:String(a),titel:'Avond '+a+' voltooid',tekst:AVONDEN[a]?AVONDEN[a][1]:'',color:BLOK_SEAL[AVONDEN[a]?AVONDEN[a][0]:'Kern']}}
function isComplete(t){const keys=['uiterlijk.helderheid','uiterlijk.intensiteit','uiterlijk.kleur','neus.intensiteit','mond.zoet','mond.zuur','mond.tannine','mond.alcohol','mond.body','mond.afdronk'];
  return !!t.score&&!!t.kwaliteit&&keys.every(k=>{const [a,b]=k.split('.');return t[a]&&t[a][b]})&&((t.neus&&t.neus.aromas)||[]).length>0}

  const rv=ids.map(id=>W[id]).filter(revealed);

}

function confetti(){
  const cv=$('#confetti');const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);const cols=['--seal-kern','--seal-ring','--seal-fund','--claret','--on-claret'].map(v=>cs.getPropertyValue(v).trim()||'#8E2A3A');
  const W=cv.clientWidth,H=cv.clientHeight;
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*.38,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3,round:Math.random()<.4}));
  const t0=performance.now();
  (function frame(t){ctx.clearRect(0,0,W,H);const life=(t-t0)/2600;
    ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.globalAlpha=Math.max(0,1-life);ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.r*.6,0,7);ctx.fill()}else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(life<1)confettiRaf=requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H)})(t0);
}


/* ---------- kennis: regio's, druiven, profielen ---------- */
const canon=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const SYNONIEMEN=[['syrah','shiraz'],['zinfandel','primitivo'],['grenache','garnacha','cannonau'],['pinot grigio','pinot gris','grauburgunder'],['albarino','alvarinho'],['monastrell','mourvedre'],['tempranillo','tinta roriz','aragonez','tinto fino'],['pinot noir','spatburgunder','blauburgunder'],['chasselas','fendant'],['macabeo','viura'],['moscato','muscat','moscatel'],['melon de bourgogne','muscadet'],['nielluccio','sangiovese']];
function syn(c){for(const g of SYNONIEMEN)if(g.includes(c))return g;return [c]}
function grapeMatch(guess,w){
  const gs=String(guess||'').split('/').map(canon).filter(x=>x.length>=3);if(!gs.length)return null;
  const wg=druiven(w).map(canon).filter(x=>x.length>=3&&!/^(blend|witte druiven|chenin blend)$/.test(x));if(!wg.length)return null;
  for(const g of gs)for(const a of syn(g))for(const b of wg)for(const bb of syn(b)){if(a===bb||(a.length>=5&&bb.includes(a))||(bb.length>=5&&a.includes(bb)))return true}
  return false;
}
function klimaatVan(w){const L=K.regios[w.land];if(!L)return '';const r=regionOf(w);return (r&&L.r[r]?L.r[r][0]:L.d)||''}
function prijsKlasse(p){return typeof p!=='number'||!p?'':p<8?'< €8':p<=12?'€8–12':'> €12'}
function grapeKey(name){const c=canon(name);for(const k of Object.keys(K.druiven)){if(k.split('/').map(canon).some(x=>x===c||syn(c).includes(x)))return k}return null}
function grapeLinks(txt){return String(txt||'').split(/,\s*/).map(g=>{const k=grapeKey(g.replace(/\(.*\)/,'').trim());return k?`<a href="#druiven" data-act="grape" data-g="${esc(k)}">${esc(g)}</a>`:esc(g)}).join(', ')}
function regionCard(land,name){
  const L=K.regios[land];const r=L&&L.r[name];if(!r)return '';const [kl,bo,dr,st,fe]=r;
  return `<div class="rcard"><dl><dt>Klimaat</dt><dd>${esc(kl)}</dd><dt>Bodem</dt><dd>${esc(bo)}</dd><dt>Druiven</dt><dd>${grapeLinks(dr)}</dd><dt>Stijl</dt><dd>${esc(st)}</dd></dl><p class="fact">${esc(fe)}</p><div>${meldKnop(name+' ('+land+')')}</div></div>`;
}
/* vergelijk de notitie met het typische profiel van de stijl */
function profielVergelijk(w,t){
  const P=K.stijlen[w.profiel];if(!P||!t)return null;
  const rows=[];const add=(label,jij,typ,ok)=>rows.push({label,jij,typ,ok});
  const u=t.uiterlijk||{},m=t.mond||{},ar=(t.neus&&t.neus.aromas)||[];
  if(u.kleur)add('Kleur',u.kleur,P.kleur.join(' / '),P.kleur.includes(u.kleur));
  if(ar.length){const hits=ar.filter(a=>P.aromas.includes(a));add('Aroma’s',ar.join(', '),P.aromas.join(', '),hits.length>0)}
  if(m.zoet)add('Zoetheid',m.zoet,P.z.join(' / '),P.z.includes(m.zoet));
  if(m.zuur)add('Zuur',m.zuur,P.zu.join(' / '),P.zu.includes(m.zuur));
  if(m.tannine)add('Tannine',m.tannine,P.t.join(' / '),P.t.includes(m.tannine));
  if(m.alcohol)add('Alcohol',m.alcohol,P.a.join(' / '),P.a.includes(m.alcohol));
  if(m.body)add('Body',m.body,P.b.join(' / '),P.b.includes(m.body));
  return {P,rows,goed:rows.filter(r=>r.ok).length};
}
function gokUitslag(w,g){
  if(!g)return null;const rows=[];
  if(g.druif){const ok=grapeMatch(g.druif,w);if(ok!==null)rows.push({label:'Druif',jij:g.druif,echt:w.druif,ok})}
  if(g.land)rows.push({label:'Land',jij:g.land,echt:w.land,ok:g.land===w.land});
  const kl=klimaatVan(w);if(g.klimaat&&kl)rows.push({label:'Klimaat',jij:g.klimaat,echt:kl,ok:g.klimaat===kl});
  if(g.hout&&w.hout!=null)rows.push({label:'Hout',jij:g.hout,echt:w.hout?'ja':'nee',ok:(g.hout==='ja')===!!w.hout});
  const pk=prijsKlasse(w.prijs);if(g.prijs&&pk)rows.push({label:'Prijs',jij:g.prijs,echt:pk+' ('+euro(w.prijs)+')',ok:g.prijs===pk});
  return rows.length?{rows,goed:rows.filter(r=>r.ok).length}:null;
}
function cmpTable(rows,col2,col3){return `<div style="overflow-x:auto"><table class="cmp"><thead><tr><th></th><th>${col2}</th><th>${col3}</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.label)}</th><td>${esc(r.jij)}</td><td>${esc(r.typ||r.echt)}</td><td class="${r.ok?'ok':'nok'}">${r.ok?'✓':'✗'}</td></tr>`).join('')}</tbody></table></div>`}

function viewFavorieten(){

function niveau(a){const b=AVONDEN[a]?AVONDEN[a][0]:'';return b==='Fundament'?'Level 1':b==='Kern'?'Level 2':b==='Fans'?'Level 2–3':'Level 3'}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(mode,avond){

  else list=(K.quiz[avond]||[]).map((_,i)=>[avond,i]);

  S.quiz={active:true,mode,avond,list,i:0,goed:0,perm:list.map(([a,i])=>shuffle(K.quiz[a][i][1].map((_,j)=>j))),gekozen:null,before:new Set(badgesFor(S.uid).map(b=>b.id))};

    return head+`<div class="head"><p class="eyebrow">Quiz · eigen vragen in WSET-stijl</p><h1>Test wat je weet</h1><p class="muted">Acht vragen per avond. Het niveau groeit mee: Fundament Level 1, Kern Level 2, Fans Level 2–3, Verdieping Level 3. Het zijn geen officiële examenvragen.</p></div>
      <label class="field" for="quiz-avond"><span>Kies een avond</span><select id="quiz-avond">${opts}</select></label>
      <p class="muted num">${niveau(a)} · ${(K.quiz[a]||[]).length} vragen${DATA.quiz.best[a]!=null?` · jouw beste score ${DATA.quiz.best[a]} van ${(K.quiz[a]||[]).length}`:''}</p>

      <a class="btn" href="#leren">Herhalen (${rijp().length} klaar)</a></div>

      <div class="card-sec"><h2>Jouw scores</h2><div class="qgrid">${Object.keys(AVONDEN).filter(n=>K.quiz[n]).map(n=>{const b=DATA.quiz.best[n];const tot=K.quiz[n].length;return `<button type="button" class="qcell${b!=null?(b>=tot-1?' top':' done'):''}" data-act="quiz-start" data-avond="${n}" aria-label="Avond ${n}: ${b!=null?b+' van '+tot:'nog niet gemaakt'}"><b>${n}</b><span class="num">${b!=null?b+'/'+tot:'–'}</span></button>`}).join('')}</div></div>`;

    ${g!=null?`<div class="learn" role="status"><b class="${g===juist?'ok':'nok'}">${g===juist?'Goed!':'Niet goed.'}</b><p>${esc(uitleg)}</p>${meldKnop(vraag)}</div>
      <div><button class="btn primary" type="button" data-act="quiz-volgende">${q.i+1<q.list.length?'Volgende vraag':'Bekijk je score'}</button></div>`:''}

function quizAntwoord(j){
  const q=S.quiz;if(!q||q.gekozen!=null)return;
  const [a,qi]=q.list[q.i];const juist=K.quiz[a][qi][2];q.gekozen=j;
  const key=a+'-'+qi;if(j===juist){q.goed++;delete DATA.quiz.fout[key]}else DATA.quiz.fout[key]=1;
  beoordeel('q:'+key,j===juist);

}
function quizVolgende(){
  const q=S.quiz;q.i++;q.gekozen=null;
  if(q.i>=q.list.length){
    DATA.quiz.gespeeld=(DATA.quiz.gespeeld||0)+1;
    if(q.mode!=='herhaal'){const prev=DATA.quiz.best[q.avond];if(prev==null||q.goed>prev)DATA.quiz.best[q.avond]=q.goed;DATA.quiz.log.push({datum:vandaag(),avond:q.avond,goed:q.goed,tot:q.list.length})}

let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}

/* ================= versie 3: leren ================= */
const INTERVAL=[0,1,3,7,14,30];
const vandaag=()=>new Date().toLocaleDateString('sv-SE');
function plusDagen(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv-SE')}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function kies(pool,n,r){const p=pool.slice();const out=[];while(p.length&&out.length<n){out.push(p.splice(Math.floor(r()*p.length),1)[0])}return out}
function maskeer(tekst,namen){let t=String(tekst);for(const n of namen)for(const part of String(n).split(/[\s\/’'-]+/).filter(x=>x.length>=4)){t=t.replace(new RegExp(part.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'…')}return t}
let KAARTEN=null;
/* alle leerkaarten: quizvragen + vragen gemaakt uit regiokaartjes en het druivenlexicon */
function kaarten(){
  if(KAARTEN)return KAARTEN;const out={};
  for(const [a,list] of Object.entries(K.quiz))list.forEach((q,i)=>{out['q:'+a+'-'+i]={id:'q:'+a+'-'+i,soort:'Quiz',topic:'Quiz · '+(AVONDEN[a]?AVONDEN[a][0]:''),vraag:q[0],opties:q[1],juist:q[2],uitleg:q[3]}});
  const regs=[];for(const [land,L] of Object.entries(K.regios))for(const [n,r] of Object.entries(L.r))regs.push({land,n,r});
  const mk=(id,topic,soort,vraag,goed,fout,uitleg)=>{const opts=[goed,...fout];out[id]={id,soort,topic,vraag,opties:opts,juist:0,uitleg}};
  regs.forEach(({land,n,r})=>{
    const R=rng(hashStr(land+n));const info=`${n}: ${r[0]} klimaat · ${r[1]} · ${r[2]}. ${r[4]}`;
    const andere=(f,zelfdeLand)=>[...new Set(regs.filter(x=>x.n!==n&&x.r[f]!==r[f]&&(!zelfdeLand||x.land===land)).map(x=>x.r[f]))];
    let fb=kies(andere(1,true),3,R);if(fb.length<3)fb=fb.concat(kies(andere(1).filter(x=>!fb.includes(x)),3-fb.length,R));
    mk('r:'+land+'|'+n+'|bodem',land,'Regio',`Welke bodem hoort bij ${n} (${land})?`,r[1],fb,info);
    let fd=kies(andere(2,true),3,R);if(fd.length<3)fd=fd.concat(kies(andere(2).filter(x=>!fd.includes(x)),3-fd.length,R));
    mk('r:'+land+'|'+n+'|druiven',land,'Regio',`Welke druiven zijn het belangrijkst in ${n} (${land})?`,r[2],fd,info);
    mk('r:'+land+'|'+n+'|klimaat',land,'Regio',`Welk klimaat heeft ${n} (${land}) volgens de WSET-indeling?`,r[0],['koel','gematigd','warm'].filter(x=>x!==r[0]),info);
    const zelfde=regs.filter(x=>x.land===land&&x.n!==n).map(x=>x.n);const fr=kies(zelfde.length>=3?zelfde:zelfde.concat(regs.filter(x=>x.land!==land).map(x=>x.n)),3,R);
    mk('r:'+land+'|'+n+'|feit',land,'Regio',`Over welke regio gaat dit? “${maskeer(r[4],[n])}”`,n,fr,info);
  });
  const dr=Object.entries(K.druiven);
  dr.forEach(([k,d])=>{
    const R=rng(hashStr(k));const zelfdeKleur=dr.filter(([k2,d2])=>k2!==k&&d2[0]===d[0]).map(x=>x[0]);const info=`${k}: ${d[1]} ${d[2]}. ${d[4]}`;
    mk('d:'+k+'|aroma','Druiven','Druif',`Welke druif past bij deze aroma’s? “${maskeer(d[1],[k])}”`,k,kies(zelfdeKleur,3,R),info);
    mk('d:'+k+'|tip','Druiven','Druif',`Welke druif herken je hieraan? “${maskeer(d[4],[k])}”`,k,kies(zelfdeKleur,3,R),info);
  });
  return KAARTEN=out;
}
function beoordeel(id,goed){
  const c=DATA.leer[id]||{box:0,goed:0,fout:0};
  if(goed){c.box=Math.min(5,(c.box||0)+1);c.goed=(c.goed||0)+1}else{c.box=1;c.fout=(c.fout||0)+1}
  c.due=plusDagen(vandaag(),goed?INTERVAL[c.box]:1);c.laatst=vandaag();DATA.leer[id]=c;
  if(!DATA.herhaalDagen.includes(vandaag()))DATA.herhaalDagen.push(vandaag());
}
function rijp(topic){const K2=kaarten();const d=vandaag();return Object.entries(DATA.leer).filter(([id,c])=>K2[id]&&c.due&&c.due<=d&&(!topic||K2[id].topic===topic)).sort((a,b)=>a[1].due.localeCompare(b[1].due)||a[1].box-b[1].box).map(x=>x[0])}
function nieuweKaarten(topic,n){
  const K2=kaarten();const W=allWines();
  const voorkeur=new Set();
  Object.keys(myT()).forEach(id=>{const w=W[id];if(w&&revealed(w)){voorkeur.add(w.land);druiven(w).forEach(g=>{const k=grapeKey(g);if(k)voorkeur.add('druif:'+k)})}});
  const kandidaten=Object.values(K2).filter(c=>!DATA.leer[c.id]&&(!topic||c.topic===topic));
  const score=c=>(c.soort==='Quiz'&&c.id.startsWith('q:'+S.avond+'-')?0:c.soort==='Quiz'&&Number(c.id.slice(2).split('-')[0])<=S.avond?1:voorkeur.has(c.topic)?1:c.soort==='Druif'&&[...voorkeur].some(v=>c.id.startsWith('d:'+v.slice(6)+'|'))?1:2);
  return kandidaten.sort((a,b)=>score(a)-score(b)||hashStr(a.id+vandaag())-hashStr(b.id+vandaag())).slice(0,n).map(c=>c.id);
}
function startSessie(topic){
  const r=rijp(topic).slice(0,20);const nieuw=nieuweKaarten(topic,Math.max(0,(topic?10:5)-Math.max(0,r.length-15)));
  const list=shuffle(r).concat(nieuw);
  if(!list.length){toast(topic?'Alles van dit onderwerp is bijgewerkt':'Niets te herhalen');return}
  S.sessie={list,i:0,goed:0,gekozen:null,perm:list.map(id=>shuffle(kaarten()[id].opties.map((_,j)=>j))),nieuw:new Set(nieuw),opnieuw:new Set(),herzien:new Set(),topic:topic||'',before:new Set(badgesFor(S.uid).map(b=>b.id))};
  location.hash='leren';render();window.scrollTo(0,0);
}
function sessieAntwoord(j){
  const s=S.sessie;if(!s||s.gekozen!=null)return;const id=s.list[s.i];const c=kaarten()[id];s.gekozen=j;const ok=j===c.juist;
  const eerste=!s.herzien.has(id);s.herzien.add(id);
  if(eerste){beoordeel(id,ok);if(ok)s.goed++;
    if(id.startsWith('q:')){const key=id.slice(2);if(ok)delete DATA.quiz.fout[key];else DATA.quiz.fout[key]=1}
    if(!ok){s.opnieuw.add(id);s.list.push(id);s.perm.push(shuffle(c.opties.map((_,k)=>k)))}}
  saveData();render();
}
function sessieVolgende(){
  const s=S.sessie;s.i++;s.gekozen=null;
  if(s.i>=s.list.length){saveData();render();const fresh=badgesFor(S.uid).filter(b=>!s.before.has(b.id));if(fresh.length)celebrate(fresh);return}
  render();window.scrollTo(0,0);
}
function onderwerpen(){
  const K2=kaarten();const t={};
  for(const c of Object.values(K2)){const o=t[c.topic]=t[c.topic]||{n:0,gezien:0,beheerst:0,rijp:0};o.n++;const l=DATA.leer[c.id];if(l){o.gezien++;if(l.box>=4)o.beheerst++;if(l.due<=vandaag())o.rijp++}}
  return t;
}
function weetje(){
  const pool=[];for(const [land,L] of Object.entries(K.regios))for(const [n,r] of Object.entries(L.r))pool.push({id:'r:'+land+'|'+n+'|feit',kop:n+' · '+land,tekst:r[4],link:GEO.countries[land]?{href:'#land-'+GEO.countries[land].slug,region:n}:null});
  for(const [k,d] of Object.entries(K.druiven))pool.push({id:'d:'+k+'|tip',kop:k,tekst:d[4],grape:k});
  const open=pool.filter(p=>!(DATA.leer[p.id]&&DATA.leer[p.id].box>=3));const lijst=open.length?open:pool;
  return lijst[hashStr(vandaag())%lijst.length];
}
function weetjeHtml(compact){
  const w=weetje();const inLeer=!!DATA.leer[w.id];
  return `<div class="weetje"><p class="eyebrow">Weetje van de dag · ${esc(w.kop)}</p><p>${esc(w.tekst)}</p>
    <div class="linkrow">${inLeer?'<span class="muted small">Staat in je herhaling</span>':`<button class="btn" type="button" data-act="weetje-leer" data-id="${esc(w.id)}">Zet in mijn herhaling</button>`}
    ${w.link?`<a class="btn ghost" href="${w.link.href}" data-act="goto-region" data-region="${esc(w.link.region)}">Op de kaart</a>`:''}${w.grape?`<a class="btn ghost" href="#druiven" data-act="grape" data-g="${esc(w.grape)}">In het lexicon</a>`:''}</div></div>`;
}
function viewLeren(){
  const s=S.sessie;const head=`<div class="crumbs"><a href="#start">Start</a><span>›</span><span>Leren</span></div>`;

    if(s.i>=s.list.length){const morgen=Object.values(DATA.leer).filter(c=>c.due===plusDagen(vandaag(),1)).length;

      ${g!=null?`<div class="learn" role="status"><b class="${g===c.juist?'ok':'nok'}">${g===c.juist?'Goed!':'Niet goed, deze komt aan het eind nog een keer.'}</b><p>${esc(c.uitleg)}</p>${meldKnop(c.vraag)}</div>
        <div><button class="btn primary" type="button" data-act="sessie-volgende">${s.i+1<s.list.length?'Volgende':'Afronden'}</button></div>`:''}
      <div><button class="btn ghost" type="button" data-act="sessie-stop">Stoppen</button></div>`;

    ${weetjeHtml()}
    <div class="card-sec"><h2>Voortgang per onderwerp</h2><p class="muted num">${tot.b} van ${tot.n} kaarten beheerst (vakje 4 of 5) · ${tot.g} gezien</p>
      <div class="p-legend"><span style="--c:var(--claret)">Beheerst</span><span style="--c:var(--gold-bar)">Gezien, nog niet beheerst</span></div>
      <div class="topics">${keys.slice(0,6).map(rij).join('')}</div>

const SCHAAL={zoet:['droog','halfdroog','halfzoet','zoet'],zuur:['laag','middel','hoog'],tannine:['laag','middel','hoog'],alcohol:['laag','middel','hoog'],body:['licht','middel','vol']};

const TIPS={
 'zuur-laag':'Je schat zuur vaak te laag in. Let op hoeveel je mond na het slikken gaat watertanden: veel speeksel is hoog zuur.',

function analyse(ids){
  const W=allWines();const t=myT();const tel={};const cat={druif:[0,0],land:[0,0],klimaat:[0,0],hout:[0,0],prijs:[0,0]};let profGoed=0,profTot=0;
  const add=k=>tel[k]=(tel[k]||0)+1;
  for(const id of ids){const w=W[id],x=t[id];if(!w||!x||w.eigen||!revealed(w))continue;
    const P=K.stijlen[w.profiel];
    if(P){const m=x.mond||{};for(const [k,sk] of [['zoet','z'],['zuur','zu'],['tannine','t'],['alcohol','a'],['body','b']]){const v=m[k];if(!v)continue;const typ=P[sk];if(typ.includes(v))continue;const sc=SCHAAL[k];const vi=sc.indexOf(v);const lo=Math.min(...typ.map(y=>sc.indexOf(y)));add(k+'-'+(vi<lo?'laag':'hoog'))}
      const pv=profielVergelijk(w,x);if(pv&&pv.rows.length){profGoed+=pv.goed;profTot+=pv.rows.length}}
    const g=gokUitslag(w,x.gok);if(g)for(const r of g.rows){const c=cat[r.label.toLowerCase()];if(!c)continue;c[1]++;if(r.ok)c[0]++;else{
      if(r.label==='Klimaat')add('klimaat-'+(KLIMAAT.indexOf(r.jij)>KLIMAAT.indexOf(r.echt)?'warm':'koel'));
      else if(r.label==='Hout')add('hout-'+r.jij);else if(r.label==='Prijs')add('prijs');else if(r.label==='Druif')add('druif')}}
  }
  const tips=Object.entries(tel).filter(([,n])=>n>=1).sort((a,b)=>b[1]-a[1]).map(([k,n])=>({k,n,tekst:TIPS[k]})).filter(x=>x.tekst);
  return {tips,cat,profGoed,profTot};
}
function terugblik(a){
  const ids=Object.keys(myT()).filter(id=>{const w=allWines()[id];return w&&!w.eigen&&Number(w.avond)===a});
  if(!isOpen(a)||!ids.length)return '';
  const r=analyse(ids);const cats=Object.entries(r.cat).filter(([,v])=>v[1]);
  return `<details class="prep" open><summary><b>Terugblik avond ${a}</b> <span class="muted small">wat ging goed, wat kan beter</span></summary>
    ${cats.length?`<div class="counts">${cats.map(([k,v])=>`<span><b>${v[0]}/${v[1]}</b> ${k}</span>`).join('')}</div>`:'<p class="muted">Vul bij de volgende avond het raadspel in, dan zie je hier hoe goed je gokte.</p>'}
    ${r.profTot?`<p class="muted num">Kenmerken gevonden: ${r.profGoed} van ${r.profTot} (${Math.round(r.profGoed/r.profTot*100)}%)</p>`:''}

}

function leerGrafiek(){
  const W=allWines();const t=myT();const punten=[];
  const avonden=[...new Set(Object.keys(K.quiz).map(Number).concat(Object.keys(t).map(id=>W[id]&&!W[id].eigen?Number(W[id].avond):0)))].filter(Boolean).sort((a,b)=>a-b);
  for(const a of avonden){
    const qb=DATA.quiz.best[a];const qp=qb!=null&&K.quiz[a]?Math.round(qb/K.quiz[a].length*100):null;
    const r=analyse(Object.keys(t).filter(id=>W[id]&&!W[id].eigen&&Number(W[id].avond)===a));const tot=Object.values(r.cat).reduce((s,v)=>[s[0]+v[0],s[1]+v[1]],[0,0]);
    const rp=tot[1]?Math.round(tot[0]/tot[1]*100):null;const kp=r.profTot?Math.round(r.profGoed/r.profTot*100):null;
    if(qp!=null||rp!=null||kp!=null)punten.push({a,qp,rp,kp});
  }
  if(punten.length<2)return `<div class="card-sec"><h2>Leerresultaten per avond</h2><p class="muted">Zodra je van minstens twee avonden een quiz of raadspel hebt, zie je hier je lijn.</p></div>`;
  const Wd=640,H=270,L=44,R=16,T=16,B=44;const n=punten.length;const x=i=>L+(n===1?0:i*(Wd-L-R)/(n-1));const y=v=>T+(100-v)*(H-T-B)/100;
  const lijn=(key,cls)=>{const pts=punten.map((p,i)=>p[key]!=null?[x(i),y(p[key])]:null);const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
    return segs.map(s=>`<polyline class="${cls}" points="${s.map(p=>p.join(',')).join(' ')}"></polyline>`).join('')+pts.filter(Boolean).map(p=>`<circle class="${cls}-dot" cx="${p[0]}" cy="${p[1]}" r="4"></circle>`).join('')};
  return `<div class="card-sec"><h2>Leerresultaten per avond</h2>
    <div class="p-legend"><span style="--c:var(--claret)">Quiz (beste score)</span><span style="--c:var(--gold-bar)">Raadspel goed</span><span style="--c:var(--good)">Kenmerken gevonden</span></div>
    <div class="chart"><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Lijngrafiek met quizscore, raadspel en gevonden kenmerken per avond, in procenten">
      ${[0,25,50,75,100].map(v=>`<line class="grid" x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}"></line><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join('')}
      ${punten.map((p,i)=>`<text class="ax" x="${x(i)}" y="${H-B+18}" text-anchor="middle">${p.a}</text>`).join('')}
      <text class="ax" x="${(L+Wd-R)/2}" y="${H-3}" text-anchor="middle">avond</text>
      ${lijn('qp','l-quiz')}${lijn('rp','l-raad')}${lijn('kp','l-kenm')}</svg></div></div>`;
}

  const h=location.hash.slice(1);
  if(h.startsWith('land-')&&SLUG[h.slice(5)]){const l=SLUG[h.slice(5)];if(S.land!==l){S.land=l;if(!S.keepRegion)S.region=null}S.view='land'}
  else S.view=BASE_VIEWS.includes(h)?h:'start';
  S.keepRegion=false;
  if(!$('#sheet').hidden)closeSheet();
  window.scrollTo(0,0);render();
}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="goto-map"],[data-act="goto-region"]');if(a){S.keepRegion=true;S.region=a.dataset.region||null}},true);
document.addEventListener('input',e=>{
  const id=e.target.id;if(id!=='f-zoek'&&id!=='f-druifzoek')return;
  const q=canon(e.target.value);const sel=id==='f-zoek'?'.rows [data-zoek]':'.grapes [data-zoek]';
  document.querySelectorAll(sel).forEach(el=>{el.hidden=!!q&&!q.split(' ').every(w=>el.dataset.zoek.includes(w))});
});

/* ---------- boot ---------- */
(function(){const n=+store.get('wj-avond');if(n>=1&&n<=28)S.avond=n;const m=store.get('wj-mode');if(m==='ik'||m==='groep')S.kaartMode=m})();
route();
function showBanner(msg){const b=$('#banner');b.textContent=msg;b.hidden=!msg}
/* ---------- lokale opslag ---------- */
function emptyData(){return {versie:3,t:{},w:{},onthuld:{},naam:'',laatsteBackup:'',quiz:{best:{},fout:{},gespeeld:0,log:[]},prefs:{kaart:'volledig'},versieGezien:'',leer:{},aroma:{},herhaalDagen:[]}}
let DATA=emptyData();
function loadData(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const d=JSON.parse(raw);const e=emptyData();DATA={...e,...d,t:d.t||{},w:d.w||{},onthuld:d.onthuld||{},quiz:{...e.quiz,...(d.quiz||{})},prefs:{...e.prefs,...(d.prefs||{})},leer:d.leer||{},aroma:d.aroma||{},herhaalDagen:d.herhaalDagen||[]};if(!Array.isArray(DATA.quiz.log))DATA.quiz.log=[]}return true}
  catch(e){return false}
}
function saveData(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA));return true}catch(e){return false}}
function syncState(){
  S.tastings={me:{t:DATA.t}};S.extra={me:{w:DATA.w}};
  S.settings={};Object.keys(DATA.onthuld).forEach(n=>{if(DATA.onthuld[n])S.settings['avond-'+n]={onthuld:true}});
  S.name=DATA.naam||'';render();
}
const nlDate=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})};
function backupDue(){const n=Object.keys(DATA.t).length+Object.keys(DATA.w).length;if(!n)return false;if(!DATA.laatsteBackup)return n>=3;return Date.now()-new Date(DATA.laatsteBackup).getTime()>31*864e5}
function viewBackup(){
  const nt=Object.keys(DATA.t).length,nw=Object.keys(DATA.w).length;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);const standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  return `<div class="crumbs"><a href="#start">Start</a><span>›</span><span>Back-up</span></div>
    <div class="head"><p class="eyebrow">Back-up en overzetten</p><h1>Jouw notities, jouw toestel</h1>
      <p class="muted">Alles wat je invult staat alleen in deze browser op dit toestel. Niemand anders ziet het, ook de organisator niet. Een ander toestel of een andere browser begint leeg.</p></div>
    <div class="stats num"><span><b>${nt}</b>proefkaarten</span><span><b>${nw}</b>eigen wijnen</span><span><b>${Object.keys(DATA.onthuld).length}</b>avonden onthuld</span></div>
    <p class="muted">Laatste back-up: <b>${DATA.laatsteBackup?esc(nlDate(DATA.laatsteBackup)):'nog nooit'}</b>${S.persisted?' · deze browser bewaart je gegevens blijvend':''}</p>
    ${ios&&!standalone?'<div class="banner"><b>Op een iPhone:</b> zet de app op je beginscherm (Deel-knop → Zet op beginscherm). In gewone Safari kan je iPhone de gegevens wissen als je de pagina zeven dagen niet opent.</div>':''}
    <div class="card-sec"><h2>Back-up maken</h2><p class="muted">Je krijgt één bestand met al je notities. Bewaar het, of stuur het naar jezelf via mail, AirDrop of WhatsApp.</p>
      <label class="field" for="f-naam"><span>Je naam (komt in de bestandsnaam en bovenaan de app)</span><input id="f-naam" type="text" maxlength="30" value="${esc(DATA.naam)}" placeholder="Bijvoorbeeld Sanne"></label>
      <div><button class="btn primary" type="button" data-act="export">Maak back-up</button></div>
      <p class="muted small">Tip: kies in het deelmenu “Bewaar in Bestanden” (iCloud Drive) of Google Drive. Dan staat je back-up in je eigen cloud en raak je hem niet kwijt.</p></div>
    <div class="card-sec"><h2>Terugzetten of overzetten</h2>
      <p class="muted">Open deze pagina op het andere toestel en kies daar het back-upbestand. Wat er al stond blijft bewaard; bij dezelfde wijn wint de nieuwste notitie. Zo houd je ook twee toestellen gelijk: maak op elk een back-up en zet die op het andere terug.</p>
      <div><label class="btn" for="f-import">Kies back-upbestand</label><input id="f-import" type="file" accept=".json,application/json" hidden></div></div>
    <div class="card-sec"><h2>Opnieuw beginnen</h2><p class="muted">Wist alle notities, eigen wijnen en onthullingen op dit toestel. Maak eerst een back-up.</p>
      <div><button class="btn danger" type="button" data-act="wipe">Alles wissen</button></div></div>`;
}
function slugify(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function exportData(){
  const today=new Date().toISOString().slice(0,10);
  const body=JSON.stringify({app:'proefjournaal',versie:1,gemaakt:new Date().toISOString(),data:{...DATA,laatsteBackup:''}},null,1);
  const name=`proefjournaal-${slugify(DATA.naam)||'back-up'}-${today}.json`;
  const blob=new Blob([body],{type:'application/json'});
  const mark=()=>{DATA.laatsteBackup=new Date().toISOString();saveData();render()};
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Proefjournaal back-up'});mark();toast('Back-up gedeeld');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);mark();toast('Back-up gedownload: '+name);
}
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;try{const j=JSON.parse(r.result);d=j&&j.app==='proefjournaal'?j.data:j}catch(e){d=null}
    if(!d||typeof d!=='object'||(typeof d.t!=='object'&&typeof d.w!=='object')){toast('Dit bestand is geen back-up van het proefjournaal.');return}
    let n=0;const stamp=v=>String((v&&(v.bijgewerkt||v.datum))||'');
    for(const b of ['t','w'])for(const [k,v] of Object.entries(d[b]||{})){
      if(!v||typeof v!=='object'||Array.isArray(v)||!/^[A-Za-z0-9_-]{1,40}$/.test(k))continue;
      const cur=DATA[b][k];if(!cur||stamp(v)>stamp(cur)){DATA[b][k]=v;n++}}
    for(const k of Object.keys(d.onthuld||{}))if(/^\d{1,2}$/.test(k)&&d.onthuld[k])DATA.onthuld[k]=true;
    if(!DATA.naam&&typeof d.naam==='string')DATA.naam=d.naam.slice(0,30);
    if(d.quiz&&typeof d.quiz==='object'){for(const [a,v] of Object.entries(d.quiz.best||{}))if(/^\d{1,2}$/.test(a)&&typeof v==='number'&&(DATA.quiz.best[a]==null||v>DATA.quiz.best[a]))DATA.quiz.best[a]=v;
      for(const k of Object.keys(d.quiz.fout||{}))if(/^\d{1,2}-\d{1,2}$/.test(k))DATA.quiz.fout[k]=1;
      if(Array.isArray(d.quiz.log))for(const x of d.quiz.log)if(x&&typeof x==='object'&&!DATA.quiz.log.some(y=>y.datum===x.datum&&y.avond===x.avond&&y.goed===x.goed))DATA.quiz.log.push({datum:String(x.datum||'').slice(0,10),avond:+x.avond||0,goed:+x.goed||0,tot:+x.tot||0})}
    if(d.leer&&typeof d.leer==='object')for(const [k,v] of Object.entries(d.leer)){if(!v||typeof v!=='object'||k.length>200)continue;const cur=DATA.leer[k];if(!cur||String(v.laatst||'')>String(cur.laatst||''))DATA.leer[k]={box:Math.max(0,Math.min(5,+v.box||0)),goed:+v.goed||0,fout:+v.fout||0,due:String(v.due||'').slice(0,10),laatst:String(v.laatst||'').slice(0,10)}}
    if(d.aroma&&typeof d.aroma==='object')for(const [k,v] of Object.entries(d.aroma)){if(!v||typeof v!=='object')continue;const cur=DATA.aroma[k]||{goed:0,keer:0};if((+v.keer||0)>cur.keer)DATA.aroma[k]={goed:+v.goed||0,keer:+v.keer||0}}
    if(Array.isArray(d.herhaalDagen))for(const x of d.herhaalDagen)if(/^\d{4}-\d{2}-\d{2}$/.test(x)&&!DATA.herhaalDagen.includes(x))DATA.herhaalDagen.push(x);
    if(!saveData()){toast('Terugzetten lukte niet: de browser staat geen opslag toe.');return}
    syncState();toast(n?`${plural(n,'notitie of wijn','notities en wijnen')} teruggezet`:'Alles uit de back-up stond hier al');
  };
  r.readAsText(file);
}
document.addEventListener('change',e=>{
  if(e.target.id==='f-import'&&e.target.files[0]){importFile(e.target.files[0]);e.target.value=''}
  if(e.target.id==='f-naam'){DATA.naam=e.target.value.trim().slice(0,30);saveData();S.name=DATA.naam;toast('Naam bewaard')}
});
async function boot(){
  S.db=true;S.uid='me';S.kaartMode='ik';
  S.wines=WINES||{};S.loaded=true;
  if(!loadData())showBanner('Deze browser staat geen opslag toe (privévenster?). Je notities worden niet bewaard.');
  else{try{localStorage.setItem(STORE_KEY+'-test','1');localStorage.removeItem(STORE_KEY+'-test')}catch(e){showBanner('Deze browser staat geen opslag toe (privévenster?). Je notities worden niet bewaard.')}}
  syncState();
  try{if(navigator.storage&&navigator.storage.persist){S.persisted=await navigator.storage.persisted()||await navigator.storage.persist()}}catch(e){}
  for(const k of Object.keys(DATA.quiz.fout||{})){const id='q:'+k;if(!DATA.leer[id])DATA.leer[id]={box:1,goed:0,fout:1,due:vandaag(),laatst:vandaag()}}
  if(DATA.versieGezien!==APP_VERSIE){if(Object.keys(DATA.t).length)S.nieuw=true;DATA.versieGezien=APP_VERSIE;saveData()}
  if('serviceWorker' in navigator&&window.isSecureContext){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){const b=$('#banner');b.innerHTML='';const sp=document.createElement('span');sp.textContent='Er is een nieuwe versie van de app. ';const bt=document.createElement('button');bt.className='btn primary';bt.type='button';bt.textContent='Vernieuwen';bt.onclick=()=>location.reload();b.append(sp,bt);b.hidden=false}});
    navigator.serviceWorker.register('sw.js').then(r=>r.update&&r.update()).catch(()=>{});
  }
  render();
}
boot();
</script>
</body>
